spring.application.name=CitizenLink

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citizenlink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# CORS Configuration for Angular (port 4200)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# JSON logging to file (clean, searchable format)
logging.structured.format.file=${LOG_STRUCTURED_FORMAT:ecs}
logging.file.name=${LOG_FILE_PATH:logs/citizenlink.json}

# Human-readable console logging (for development)
logging.structured.format.console=
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan(%logger{36}) - %msg%n

# Log rotation
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}

# Logging
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}
logging.level.com.citizenlink=${CITIZENLINK_LOG_LEVEL:DEBUG}

# Encryption Configuration
encryption.secret-key=${ENCRYPTION_SECRET_KEY}

spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# File Storage Settings
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.max-file-size=${FILE_MAX_SIZE_BYTES:5242880}
file.allowed-mime-types=${FILE_ALLOWED_MIME_TYPES:application/pdf,image/png,image/jpeg,image/jpg,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
file.allowed-extensions=${FILE_ALLOWED_EXTENSIONS:.pdf,.png,.jpg,.jpeg,.docx}

# Spring Multipart Settings
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:5MB}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${FILE_UPLOAD_DIR:./uploads}

# Hibernate — prevent CHECK constraints on enum columns so adding new enum
# values doesn't require a DB migration to alter the constraint.
spring.jpa.properties.hibernate.postgresql.enable_lazy_check_for_enum_types=true