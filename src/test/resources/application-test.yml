spring:
  datasource:
    # H2 in PostgreSQL compatibility mode so Hibernate-created schema
    # matches the production PostgreSQL schema semantics.
    # DATABASE_TO_LOWER=TRUE + CASE_INSENSITIVE_IDENTIFIERS=TRUE mirror
    # PostgreSQL's lowercase folding; DEFAULT_NULL_ORDERING=HIGH matches
    # PostgreSQL's default NULLS LAST for ascending ORDER BY.
    # NON_KEYWORDS=YEAR: H2 reserves YEAR even in PostgreSQL mode, but the
    # CaseNumberSeq entity has a `year` column. Treat it as a plain identifier.
    url: jdbc:h2:mem:citizenlink;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

jwt:
  # TEST-ONLY dummy secret - not a real credential and never used in production.
  # Production reads jwt.secret-key from the JWT_SECRET_KEY environment variable.
  secret-key: test-only-dummy-jwt-secret-012345678901234567890123456789012345678901234567890123456789
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

encryption:
  # TEST-ONLY dummy key - not a real secret and never used in production.
  # It is Base64 of 32 ASCII bytes, the full AES-256 length, so tests exercise
  # the real GCM path. A shorter key would hit the weak zero-padding path that
  # IdEncryptionServiceImpl rejects on startup (the M-11 fix).
  secret-key: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

app:
  # Not set: falls back to the JVM default zone, matching Year.now() uses in tests.
  time-zone:

cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

file:
  upload-dir: ${java.io.tmpdir}/citizenlink-test-uploads

logging:
  level:
    org.springframework.security: WARN
    com.ntg.citizenlink: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: WARN
